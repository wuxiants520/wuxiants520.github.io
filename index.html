<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的网址导航</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      text-align: center;
      color: #333;
      background: #f8f8f8;
    }

    header {
      padding: 20px 16px;
      color: white;
      background: #339999;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    header p {
      margin: 0;
      font-size: 16px;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 30px 16px;
    }

    .notice {
      margin-bottom: 24px;
      font-size: 16px;
    }

    .links {
      padding: 0;
      list-style: none;
    }

    .links li {
      display: flex;
      justify-content: center;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 16px;
      padding: 12px 0;
    }

    .links span {
      color: #888;
    }

    a {
      color: #2c90ff;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    a:hover {
      text-decoration: underline;
    }

    .contact {
      margin-top: 28px;
      font-size: 15px;
      line-height: 1.8;
    }

    footer {
      margin-top: 30px;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>亲爱的朋友</h1>
    <p>这里是我的网址导航页</p>
  </header>

  <main>
    <p class="notice">✨ 建议收藏本页面，方便下次访问！</p>

    <ul class="links">
      <li>
        <span>主要网站</span>
        <a href="https://example.com"
           target="_blank"
           rel="noopener noreferrer">
          https://example.com
        </a>
      </li>

      <li>
        <span>备用地址</span>
        <a href="https://example.org"
           target="_blank"
           rel="noopener noreferrer">
          https://example.org
        </a>
      </li>

      <li>
        <span>联系邮箱</span>
        <a href="mailto:yourname@example.com">
          yourname@example.com
        </a>
      </li>
    </ul>

    <p class="contact">
      如有问题，欢迎通过上面的邮箱联系我。
    </p>

    <footer>© 2026 我的网址导航</footer>
  </main>
</body>
</html>
